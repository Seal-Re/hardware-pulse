server:
  port: 8080

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://127.0.0.1:5432/hardware_pulse}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  data:
    redis:
      host: 127.0.0.1
      port: 6379

app:
  queue:
    unprocessed: queue.raw_listings.unprocessed
    failed: queue.raw_listings.failed
    poll-timeout-seconds: 5
  llm:
    base-url: https://api.deepseek.com
    api-key: ${APP_LLM_API_KEY}
    model-name: deepseek-chat
    timeout-seconds: 60

logging:
  level:
    com.hardwarepulse: DEBUG
    org.hibernate.SQL: WARN
